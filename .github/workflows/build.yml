# Builds the Desk app for Mac (.dmg) and Windows (.exe) on their own systems and attaches them to a
# GitHub release. Runs when a version tag is pushed: git tag v1.0.1 && git push origin v1.0.1
name: Build the Desk app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Desk ${GITHUB_REF_NAME#v}" --notes "Mac with an Apple chip: Desk-…-arm64.dmg · Intel Mac: Desk-….dmg · Windows: Desk Setup ….exe" || true
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
